<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>K-Map Solver Multi-Var</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; padding: 20px; }
        .kmap-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 90%; }
        .controls { margin-bottom: 20px; }
        select { padding: 8px; border-radius: 5px; border: 1px solid #ddd; font-size: 16px; }
        .grid { display: grid; gap: 8px; margin: 20px auto; justify-content: center; }
        .cell { width: 50px; height: 50px; border: 2px solid #eee; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: 0.3s; border-radius: 8px; background: #fafafa; font-size: 14px; }
        .cell:hover { border-color: #2196F3; background: #e3f2fd; }
        .cell.active { background-color: #2196F3; color: white; border-color: #1976D2; transform: scale(1.05); }
        button { padding: 12px 30px; background: #4CAF50; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3); transition: 0.2s; }
        button:hover { background: #45a049; transform: translateY(-2px); }
        #result { margin-top: 25px; font-size: 22px; color: #1565C0; padding: 15px; border-top: 1px solid #eee; word-break: break-all; }
    </style>
</head>
<body>
    <div class="kmap-card">
        <h2>Trình Rút Gọn K-Map Đa Biến</h2>
        <div class="controls">
            <label>Chọn số lượng biến: </label>
            <select id="varSelect" onchange="initGrid()">
                <option value="3">3 Biến (8 ô)</option>
                <option value="4" selected>4 Biến (16 ô)</option>
                <option value="5">5 Biến (32 ô)</option>
                <option value="6">6 Biến (64 ô)</option>
            </select>
        </div>
        <div id="grid" class="grid"></div>
        <button onclick="solve()">RÚT GỌN BIỂU THỨC</button>
        <div id="result">Kết quả: F = ...</div>
    </div>

    <script src="solver.js"></script>
    <script>
        let selected = new Set();
        function initGrid() {
            const numVars = parseInt(document.getElementById('varSelect').value);
            const grid = document.getElementById('grid');
            const numCells = Math.pow(2, numVars);
            selected.clear();
            grid.innerHTML = '';
            
            // Thiết lập số cột cho lưới
            let cols = (numVars <= 4) ? 4 : (numVars === 5 ? 8 : 8);
            grid.style.gridTemplateColumns = `repeat(${cols}, 50px)`;

            for (let i = 0; i < numCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = i;
                cell.onclick = () => {
                    cell.classList.toggle('active');
                    if (selected.has(i)) selected.delete(i); else selected.add(i);
                };
                grid.appendChild(cell);
            }
            document.getElementById('result').innerText = "Kết quả: F = ...";
        }

        function solve() {
            const numVars = parseInt(document.getElementById('varSelect').value);
            const result = quineMcCluskey(Array.from(selected), numVars);
            document.getElementById('result').innerHTML = "Kết quả: <b>F = " + result + "</b>";
        }
        initGrid();
    </script>
</body>
</html>
