<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>K-Map Solver Pro</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; padding-top: 50px; }
        .kmap-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(4, 60px); gap: 8px; margin: 20px 0; }
        .cell { width: 60px; height: 60px; border: 2px solid #eee; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: 0.3s; border-radius: 8px; background: #fafafa; }
        .cell:hover { border-color: #2196F3; background: #e3f2fd; }
        .cell.active { background-color: #2196F3; color: white; border-color: #1976D2; transform: scale(1.05); }
        button { padding: 12px 30px; background: #2196F3; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3); transition: 0.2s; }
        button:hover { background: #1976D2; transform: translateY(-2px); }
        #result { margin-top: 25px; font-size: 22px; color: #1565C0; padding: 15px; border-top: 1px solid #eee; width: 100%; }
    </style>
</head>
<body>
    <div class="kmap-card">
        <h2>Trình Rút Gọn K-Map 4 Biến</h2>
        <p>Chọn các ô Minterm (số 1) bên dưới:</p>
        <div id="grid" class="grid"></div>
        <button onclick="solve()">RÚT GỌN BIỂU THỨC</button>
        <div id="result">Kết quả: F = ...</div>
    </div>
    <script src="solver.js"></script>
    <script>
        const grid = document.getElementById('grid');
        const kmapOrder = [0, 1, 3, 2, 4, 5, 7, 6, 12, 13, 15, 14, 8, 9, 11, 10];
        const selected = new Set();
        kmapOrder.forEach(i => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = i;
            cell.onclick = () => {
                cell.classList.toggle('active');
                if (selected.has(i)) selected.delete(i); else selected.add(i);
            };
            grid.appendChild(cell);
        });
        function solve() {
            if (typeof quineMcCluskey === 'undefined') { alert('Đang tải dữ liệu, vui lòng đợi giây lát!'); return; }
            const result = quineMcCluskey(Array.from(selected));
            document.getElementById('result').innerHTML = "Kết quả: <b>F = " + result + "</b>";
        }
    </script>
</body>
</html>
